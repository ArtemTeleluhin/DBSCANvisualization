<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Визуализация DBSCAN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: block;
        }

        .app-container {
            display: flex;
            background: white;
            overflow: hidden;
        }

        .control-panel {
            width: 360px;
            height: 100vh;
            background: #f8f9fa;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .panel-section {
            background: white;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .panel-section h3 {
            color: #333;
            font-size: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .selector {
            display: flex;
            flex-direction: column;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option:hover {
            background: #f0f0f0;
        }

        .option input[type="radio"] {
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            color: #555;
        }

        .slider-control {
            margin-bottom: 5px;
        }

        .slider-control label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .slider-control input {
            width: 100%;
            cursor: pointer;
        }

        .slider-value {
            display: inline-block;
            margin-top: 5px;
            color: #667eea;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .button-group-sets {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .btn-start {
            background: #4caf50;
            color: white;
        }

        .btn-start:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-clear {
            background: #ff5722;
            color: white;
        }

        .btn-clear:hover {
            background: #f4511e;
            transform: translateY(-1px);
        }

        .canvas-area {
            flex: 1;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
            background-color: #fff;
            cursor: crosshair;
        }

        .info {
            margin-top: 10px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="control-panel">
        <div class="panel-section" id="metrics">
            <h3>Метрика расстояния</h3>
            <div class="selector">
                <div class="option">
                    <input type="radio" id="euclidean" name="metric" value="euclidean" checked>
                    <label for="euclidean">Евклидово расстояние</label>
                </div>
                <div class="option">
                    <input type="radio" id="manhattan" name="metric" value="manhattan">
                    <label for="manhattan">Манхэттенское расстояние</label>
                </div>
                <div class="option">
                    <input type="radio" id="chebyshev" name="metric" value="chebyshev">
                    <label for="chebyshev">Расстояние Чебышёва</label>
                </div>
            </div>
        </div>
        <div class="panel-section" id="algorithms">
            <h3>Вариант алгоритма DBSCAN</h3>
            <div class="selector">
                <div class="option">
                    <input type="radio" id="primitive" name="algorithm" value="primitive" checked>
                    <label for="primitive">Примитивный (без учёта числа соседей)</label>
                </div>
                <div class="option">
                    <input type="radio" id="advanced" name="algorithm" value="advanced">
                    <label for="advanced">Продвинутый (с учётом числа соседей)</label>
                </div>
            </div>
        </div>
        <div class="panel-section" id="searches">
            <h3>Порядок перебора вершин в кластере</h3>
            <div class="selector">
                <div class="option">
                    <input type="radio" id="BFS" name="search" value="BFS" checked>
                    <label for="BFS">В порядке очереди (BFS)</label>
                </div>
                <div class="option">
                    <input type="radio" id="DFS" name="search" value="DFS">
                    <label for="DFS">С последней добавленной (DFS)</label>
                </div>
            </div>
        </div>
        <div class="panel-section">
            <h3>Параметры алгоритма</h3>
            <div class="slider-control">
                <label for="eps">Радиус поиска: <span id="epsValue" class="slider-value">75</span></label>
                <input type="range" id="eps" min="10" max="200" step="1" value="75">
            </div>
            <div class="slider-control">
                <label for="neighbours">Минимальное количество соседей: <span id="neighboursValue" class="slider-value">4</span></label>
                <input type="range" id="neighbours" min="1" max="10" step="1" value="4">
            </div>
            <div class="slider-control">
                <label for="speed">Скорость: <span id="speedValue" class="slider-value">50</span></label>
                <input type="range" id="speed" min="1" max="100" step="1" value="50">
            </div>
        </div>
        <div class="panel-section">
            <h3>Пошаговое управление</h3>
            <div class="button-group" id="steps">
                <button id="toBegin" class="btn-step">⏮</button>
                <button id="previousStep" class="btn-step">◀◀</button>
                <button id="startPause" class="btn-start">▶</button>
                <button id="nextStep" class="btn-step">▶▶</button>
                <button id="toEnd" class="btn-step">⏭</button>
            </div>
        </div>
        <div class="panel-section">
            <h3>Инструменты</h3>
            <div class="button-group" id="drawing">
                <button id="addDelete" class="btn-delete">Удаление вершин</button>
                <button id="cancel" class="btn-cancel">Отмена действия</button>
                <button id="clear" class="btn-clear">Очистить</button>
            </div>
        </div>
        <div class="panel-section" id="visualization">
            <h3>Настройка визуализации</h3>
            <input type="checkbox" id="edges" name="visualization" checked>
            <label for="edges">Соединять соседние точки</label>
            <br>
            <input type="checkbox" id="area" name="visualization" checked>
            <label for="area">Отображать радиус поиска соседей</label>
            <br>
            <input type="checkbox" id="grid" name="visualization" checked>
            <label for="grid">Рисовать на фоне сетку</label>
            <br>
            <input type="checkbox" id="indicator" name="visualization" checked>
            <label for="indicator">Отображать в углу зону поиска</label>
        </div>
        <div class="panel-section">
            <h3>Примеры датасетов</h3>
            <div class="button-group-sets" id="datasets">
                <button id="set_4" class="btn-set">Три маленьких кластера</button>
                <button id="set_3" class="btn-set">Два кластера и мостик</button>
                <button id="set_1" class="btn-set">Опрос студентов</button>
                <button id="set_2" class="btn-set">Кластеры из кластеров</button>
                <button id="set_5" class="btn-set">Три регрессии</button>
                <button id="set_7" class="btn-set">Два кольца</button>
                <button id="set_8" class="btn-set">Две параболы</button>
                <button id="set_6" class="btn-set">Переплетение кластеров</button>
                <button id="set_9" class="btn-set">Поворот на 45 градусов</button>
            </div>
        </div>
        <div class="info">
            Кликните по плоскости, чтобы добавить круг
        </div>
    </div>
    <div class="canvas-area">
        <canvas id="canvas"></canvas>
    </div>
</div>
<script type="module" src="index2.js"></script>
</body>
</html>
